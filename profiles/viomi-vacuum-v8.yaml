name: viomi-vacuum-v8
components:
- id: main
  capabilities:
  - id: switch
    version: 1
  - id: battery
    version: 1
  - id: robotCleanerMovement
    version: 1
  - id: robotCleanerOperatingState
    version: 1
  - id: fluteriver09555.vacuumDock
    version: 1
  - id: fluteriver09555.vacuumRoomSelector
    version: 1
  - id: robotCleanerCleaningMode
    version: 1
  - id: robotCleanerTurboMode
    version: 1
  - id: fanSpeed
    version: 1
  - id: fluteriver09555.vacuumLocate
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: RobotCleaner

deviceConfig:
  dashboard:
    states:
      - component: main
        capability: switch
        version: 1
        group: main
        values:
          - label: "{{switch.value}}"
        composite: true
      - component: main
        capability: battery
        version: 1
        group: main
        values:
          - label: " {{battery.value}}%"
        composite: true
    actions:
      - component: main
        capability: switch
        version: 1
    basicPlus: []
  detailView:
    - component: main
      capability: switch
      version: 1
    - component: main
      capability: battery
      version: 1
    - component: main
      capability: robotCleanerMovement
      version: 1
    - component: main
      capability: robotCleanerOperatingState
      version: 1
    - component: main
      capability: fluteriver09555.vacuumDock
      version: 1
    - component: main
      capability: fluteriver09555.vacuumRoomSelector
      version: 1
    - component: main
      capability: robotCleanerCleaningMode
      version: 1
    - component: main
      capability: robotCleanerTurboMode
      version: 1
    - component: main
      capability: fanSpeed
      version: 1
    - component: main
      capability: fluteriver09555.vacuumLocate
      version: 1
    - component: main
      capability: refresh
      version: 1
  automation:
    conditions:
      - component: main
        capability: switch
        version: 1
      - component: main
        capability: battery
        version: 1
      - component: main
        capability: robotCleanerMovement
        version: 1
      - component: main
        capability: robotCleanerOperatingState
        version: 1
      - component: main
        capability: fluteriver09555.vacuumRoomSelector
        version: 1
      - component: main
        capability: robotCleanerCleaningMode
        version: 1
      - component: main
        capability: robotCleanerTurboMode
        version: 1
      - component: main
        capability: fanSpeed
        version: 1
    actions:
      - component: main
        capability: switch
        version: 1
      - component: main
        capability: robotCleanerOperatingState
        version: 1
      - component: main
        capability: fluteriver09555.vacuumDock
        version: 1
      - component: main
        capability: fluteriver09555.vacuumRoomSelector
        version: 1
      - component: main
        capability: robotCleanerCleaningMode
        version: 1
      - component: main
        capability: robotCleanerTurboMode
        version: 1
      - component: main
        capability: fanSpeed
        version: 1
      - component: main
        capability: fluteriver09555.vacuumLocate
        version: 1

preferences:
- name: ipAddress
  title: "Adres IP"
  description: "Adres IP odkurzacza w Twojej sieci lokalnej (np. 192.168.10.122)"
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: token
  title: "Token urządzenia"
  description: "32-znakowy token szesnastkowy (hex) z Xiaomi Cloud Extractor"
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: pollInterval
  title: "Interwał odpytywania (sekundy)"
  description: "Częstotliwość odpytywania stanu odkurzacza w sekundach"
  required: false
  preferenceType: integer
  definition:
    minimum: 10
    maximum: 300
    default: 30
- name: switchOffAction
  title: "Akcja po wyłączeniu (Switch OFF)"
  description: "Działanie wykonywane po kliknięciu wyłączenia odkurzacza"
  required: false
  preferenceType: enumeration
  definition:
    options:
      dock: "Powrót do bazy i ładowanie"
      stop: "Zatrzymanie w miejscu"
      pause: "Wstrzymanie sprzątania (Pauza)"
    default: "dock"
- name: mopMode
  title: "Tryb pracy mopa"
  description: "Wymuś tryb mopowania lub pozostaw automatyczne wykrywanie"
  required: false
  preferenceType: enumeration
  definition:
    options:
      auto: "Automatycznie (wg pojemnika)"
      vacuum: "Tylko odkurzanie"
      vacuum_and_mop: "Odkurzanie i mopowanie"
      mop: "Tylko mopowanie"
    default: "auto"
- name: room1Name
  title: "Nazwa: Pokój 1"
  description: "Nazwa pierwszego pokoju"
  required: false
  preferenceType: string
  definition:
    stringType: text
    default: "Kuchnia"
- name: room2Name
  title: "Nazwa: Pokój 2"
  description: "Nazwa drugiego pokoju"
  required: false
  preferenceType: string
  definition:
    stringType: text
    default: "Salon"
- name: room3Name
  title: "Nazwa: Pokój 3"
  description: "Nazwa trzeciego pokoju"
  required: false
  preferenceType: string
  definition:
    stringType: text
    default: "Korytarz"
- name: room4Name
  title: "Nazwa: Pokój 4"
  description: "Nazwa czwartego pokoju"
  required: false
  preferenceType: string
  definition:
    stringType: text
    default: "Sypialnia"
- name: room5Name
  title: "Nazwa: Pokój 5"
  description: "Nazwa piątego pokoju"
  required: false
  preferenceType: string
  definition:
    stringType: text
    default: "Pokój Kasi"
- name: room6Name
  title: "Nazwa: Pokój 6"
  description: "Nazwa szóstego pokoju"
  required: false
  preferenceType: string
  definition:
    stringType: text
    default: "Pokój Maćka"
- name: room7Name
  title: "Nazwa: Pokój 7"
  description: "Nazwa siódmego pokoju"
  required: false
  preferenceType: string
  definition:
    stringType: text
    default: "Łazienka"
- name: room8Name
  title: "Nazwa: Pokój 8"
  description: "Nazwa ósmego pokoju"
  required: false
  preferenceType: string
  definition:
    stringType: text
    default: "Pokój 8"
- name: createDev
  title: "Utwórz kolejne urządzenie"
  description: "Przełącz, aby utworzyć dodatkowy profil urządzenia na hubie"
  required: false
  preferenceType: boolean
  definition:
    default: false
