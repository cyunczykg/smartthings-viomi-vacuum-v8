preferences:
- name: ipAddress
  title: "Adres IP"
  description: "Adres IP odkurzacza w Twojej sieci lokalnej (np. 192.168.10.122)"
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: token
  title: "Token urządzenia"
  description: "32-znakowy token szesnastkowy (hex) z Xiaomi Cloud Extractor"
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: pollingInterval
  title: "Interwał odpytywania (s)"
  description: "Częstotliwość sprawdzania statusu odkurzacza (domyślnie 30s)"
  required: false
  preferenceType: integer
  definition:
    minimum: 10
    maximum: 300
    default: 30
- name: offAction
  title: "Akcja po wyłączeniu (Off)"
  description: "Co ma zrobić odkurzacz po wyłączeniu przełącznika głównego"
  required: false
  preferenceType: enumeration
  definition:
    options:
      dock: "Powrót do bazy (Ładowanie)"
      stop: "Zatrzymanie (Stop)"
      pause: "Wstrzymanie (Pauza)"
    default: "dock"
- name: mopMode
  title: "Tryb pracy mopa"
  description: "Wybór trybu odkurzania/mopowania"
  required: false
  preferenceType: enumeration
  definition:
    options:
      auto: "Automatycznie (wg pojemnika)"
      vacuum: "Tylko odkurzanie"
      vacuum_and_mop: "Odkurzanie i mopowanie"
      mop: "Tylko mopowanie"
    default: "auto"
- name: room1Name
  title: "Nazwa: Pokój 1"
  description: "Nazwa pierwszego pokoju"
  required: false
  preferenceType: string
  definition:
    stringType: text
    default: "Kuchnia"
- name: room2Name
  title: "Nazwa: Pokój 2"
  description: "Nazwa drugiego pokoju"
  required: false
  preferenceType: string
  definition:
    stringType: text
    default: "Salon"
- name: room3Name
  title: "Nazwa: Pokój 3"
  description: "Nazwa trzeciego pokoju"
  required: false
  preferenceType: string
  definition:
    stringType: text
    default: "Korytarz"
- name: room4Name
  title: "Nazwa: Pokój 4"
  description: "Nazwa czwartego pokoju"
  required: false
  preferenceType: string
  definition:
    stringType: text
    default: "Sypialnia"
- name: room5Name
  title: "Nazwa: Pokój 5"
  description: "Nazwa piątego pokoju"
  required: false
  preferenceType: string
  definition:
    stringType: text
    default: "Pokój Kasi"
- name: room6Name
  title: "Nazwa: Pokój 6"
  description: "Nazwa szóstego pokoju"
  required: false
  preferenceType: string
  definition:
    stringType: text
    default: "Pokój Maćka"
- name: room7Name
  title: "Nazwa: Pokój 7"
  description: "Nazwa siódmego pokoju"
  required: false
  preferenceType: string
  definition:
    stringType: text
    default: "Łazienka"
- name: room8Name
  title: "Nazwa: Pokój 8"
  description: "Nazwa ósmego pokoju"
  required: false
  preferenceType: string
  definition:
    stringType: text
    default: "Pokój 8"
- name: createDev
  title: "Utwórz kolejne urządzenie"
  description: "Przełącz, aby utworzyć dodatkowy profil urządzenia na hubie"
  required: false
  preferenceType: boolean
  definition:
    default: false
